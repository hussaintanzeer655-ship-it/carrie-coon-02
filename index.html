<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1' />
  <title>Gallery SPA</title>
  <link rel='stylesheet' href='styles.css' />
</head>
<body>
  <header class='site-header'>
    <div class='brand'>Carrie Coon</div>
    <nav aria-label='Main'><a href='#grid'>Gallery</a><a href='#about'>About</a></nav>
  </header>
  <section id='hero' class='panel' style='padding-top:100px;text-align:center'>
    <h1>Visual Gallery</h1><p>Click thumbnails to view details.</p>
  </section>
  <section id='grid' class='panel'>
    <div class='grid'></div>
  </section>
  <section id='about' class='panel'>
    <h2>About</h2>
    <p>Curated visuals and stills.</p>
  </section>
  <section id='contact' class='panel'>
    <h2>Contact</h2>
    <form onsubmit='return false'>
      <label>Name<input id='name2' required /></label>
      <label>Email<input id='email2' type='email' required /></label>
      <button type='submit'>Inquire</button>
    </form>
  </section>
  <script src='script.js'></script>
</body>
</html>
